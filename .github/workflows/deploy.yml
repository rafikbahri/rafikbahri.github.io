---
name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:
  schedule:
    # Rebuild every Jan 1st so the footer copyright year stays current
    - cron: '0 0 1 1 *'

env:
  MAIN_BRANCH_NAME: master
  CF_PROJECT_NAME: rafikbahri-com
  BUILD_DIRECTORY: dist

jobs:
  deploy:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      deployments: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '25'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Astro site
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ${{ env.BUILD_DIRECTORY }} --project-name=${{ env.CF_PROJECT_NAME }} --branch=${{ env.MAIN_BRANCH_NAME }}

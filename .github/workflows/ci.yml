---
name: CI

# Pre-merge gate. Nothing here deploys or touches Cloudflare: it builds the PR
# and smoke-tests that build locally, so a change is verified before the merge
# to master that publishes it.
on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR branch makes the in-flight run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_DIRECTORY: dist
  PREVIEW_URL: http://127.0.0.1:4321

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '25'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Same command deploy.yml runs: astro check (types + content schema) then astro build
      - name: Build Astro site
        run: npm run build

      # Handed to the smoke job, and downloadable from the run for manual review
      - name: Upload build output
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: ${{ env.BUILD_DIRECTORY }}
          retention-days: 7

  smoke:
    name: Smoke test the build
    needs: build
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '25'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download build output
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: dist
          path: ${{ env.BUILD_DIRECTORY }}

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # astro preview serves the built dist/ as a plain static site, so the
      # smoke tests run against this PR's output instead of the live site.
      - name: Start preview server
        run: |
          npm run preview -- --host 127.0.0.1 --port 4321 > preview.log 2>&1 &
          for _ in $(seq 1 30); do
            if curl -fsS -o /dev/null "${PREVIEW_URL}"; then
              exit 0
            fi
            sleep 1
          done
          echo "::error::Preview server did not answer on ${PREVIEW_URL} within 30s"
          cat preview.log
          exit 1

      - name: Run smoke tests
        run: npm run test:smoke
        env:
          SITE_URL: ${{ env.PREVIEW_URL }}

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
